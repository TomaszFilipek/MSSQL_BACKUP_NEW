services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mssqlbackup-api
    ports:
      - "8283:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/MssqlBackup.db
    volumes:
      - api-data:/app/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: mssqlbackup-web
    ports:
      - "8284:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ApiSettings__BaseUrl=http://api:5000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  api-data:
