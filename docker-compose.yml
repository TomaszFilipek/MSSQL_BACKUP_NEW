services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mssqlbackup-api
    ports:
      - "8283:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/MssqlBackup.db
    volumes:
      - api-data:/app/data
    restart: unless-stopped

volumes:
  api-data:
